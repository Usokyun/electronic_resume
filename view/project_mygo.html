<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目介绍页面</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="project-page-body">

    <div class="project-container">
        <!-- 左侧部分：项目封面、标签、满意度、创建时间等 -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 15px;">
            <div class="card">
                <h2 class="section-title">项目详情</h2>
                <div class="cover">
                    <img style= "object-fit: cover; padding: 1px; border-style: solid; border-width: 1px;
                    " src="../project/迷星叫/迷叫星封面.png" alt="项目封面图片">
                </div>
                <div class="label" style="font-weight: bolder; display: flex; justify-content: center;
                ">迷星叫PV</div>

            </div>

            <div class="card">


                <h2 class="section-title">标签</h2>
                <div class="tags">
                    <span>二次元</span>
                    <span>美术</span>
                    <span>设计</span>
                    <span>美少女</span>
                    <span>AE剪辑</span>
                </div>

            </div>

            <div class="card">
                <!-- 满意度进度条 -->
                <div class="progress-container">
                    <div class="progress-label">满意度</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 70%;"></div> <!-- 进度条 -->
                    </div>
                </div>

                <!-- 消耗时间进度条 -->
                <div class="progress-container">
                    <div class="progress-label">消耗时间</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 95%;"></div> <!-- 进度条 -->
                    </div>
                </div>

                <!-- 获得成就进度条 -->
                <div class="progress-container">
                    <div class="progress-label">获得成就</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 40%;"></div> <!-- 进度条 -->
                    </div>
                </div>

            </div>

            <div class="card">
                <h2 class="section-title">创建时间</h2>
                <div style="width: 100%; height: 100px;">

                    <div class="loader">
                        <div class="square" id="sq1"></div>
                        <div class="square" id="sq2"></div>
                        <div class="square" id="sq3"></div>
                        <div class="square" id="sq4"></div>
                        <div class="square" id="sq5"></div>
                        <div class="square" id="sq6"></div>
                        <div class="square" id="sq7"></div>
                        <div class="square" id="sq8"></div>
                        <div class="square" id="sq9"></div>
                    </div>

                </div>
                <div>
                    <p>2023年12月25日</p>
                </div>

            </div>






        </div>

        <!-- 右侧部分：项目简介和图片展示 -->
        <div class="project-content">

            <div class="card">
                <h2 class="section-title">项目简介</h2>
                <div class="project-description">
                    <p>
                        &ensp;&ensp;&ensp;&ensp;你说的对，但是MyGo是一部重力系二次元美少女乐队番，在里面你将扮演一名叫做千早爱音的吉他手，在一个名叫霓虹的地方四处寻找伙伴最终组建一辈子乐队。
                        <br>
                        &ensp;&ensp;&ensp;&ensp;迷星叫是其中我很喜欢的一首歌，它展现了高松灯在迷茫中不断挣扎的情绪。这引发了我的共鸣，所以我通过AE制作剪辑了这部PV
                        <br>
                    </p>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">项目图片</h2>
                <div class="project-images" style="display: flex; flex-wrap: wrap;  border-width: 2px; 
                border-color: rgb(108, 192, 231);  border-style:dotted; border-radius: 20px; margin: 20px;
                padding: 20px;">
                    <img src="../project/迷星叫/迷叫星封面.png" alt="项目图片1" style="object-fit: cover;">
                    <img src="../project/迷星叫/灯_指.png" style="object-fit: cover;" alt="项目图片2">
                    <img src="../project/迷星叫/迷星叫.png" alt="项目图片3">
                    <img src="../project/迷星叫/迷星叫1.png" alt="项目图片4">
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">项目展示</h2>
                <div class="project-description">
                    <p>这是一个剪辑作品，所以你可以直接观看它！</p>
                    <div style="display: flex; justify-content: center;">
                        <video style="width: 100%;" controls>
                            <source src="../project/迷星叫/11月30日.mp4" type="video/mp4">
                            您的浏览器不支持视频标签。
                        </video>

                    </div>
                </div>

            </div>




        </div>
    </div>

</body>

</html>
