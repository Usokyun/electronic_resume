<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目介绍页面</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="project-page-body">

    <div class="project-container">
        <!-- 左侧部分：项目封面、标签、满意度、创建时间等 -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 15px;">
            <div class="card">
                <h2 class="section-title">项目详情</h2>
                <div class="cover">
                    <img style= "object-fit: cover; padding: 1px; border-style: solid; border-width: 1px;
                    " src="../project/数字岩芯/数字岩芯_正视图等参线.png" alt="项目封面图片">
                </div>
                <div class="label" style="font-weight: bolder; display: flex; justify-content: center;
                ">数字岩芯3D模型</div>

            </div>

            <div class="card">


                <h2 class="section-title">标签</h2>
                <div class="tags">
                    <span>3D建模</span>
                    <span>美术</span>
                    <span>设计</span>
                    <span>海报</span>
                    <span>渲染</span>
                </div>

            </div>

            <div class="card">
                <!-- 满意度进度条 -->
                <div class="progress-container">
                    <div class="progress-label">满意度</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 85%;"></div> <!-- 进度条 -->
                    </div>
                </div>

                <!-- 消耗时间进度条 -->
                <div class="progress-container">
                    <div class="progress-label">消耗时间</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 80%;"></div> <!-- 进度条 -->
                    </div>
                </div>

                <!-- 获得成就进度条 -->
                <div class="progress-container">
                    <div class="progress-label">获得成就</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 80%;"></div> <!-- 进度条 -->
                    </div>
                </div>

            </div>

            <div class="card">
                <h2 class="section-title">创建时间</h2>
                <div style="width: 100%; height: 100px;">

                    <div class="loader">
                        <div class="square" id="sq1"></div>
                        <div class="square" id="sq2"></div>
                        <div class="square" id="sq3"></div>
                        <div class="square" id="sq4"></div>
                        <div class="square" id="sq5"></div>
                        <div class="square" id="sq6"></div>
                        <div class="square" id="sq7"></div>
                        <div class="square" id="sq8"></div>
                        <div class="square" id="sq9"></div>
                    </div>

                </div>
                <div>
                    <p>2021年12月25日</p>
                </div>

            </div>






        </div>

        <!-- 右侧部分：项目简介和图片展示 -->
        <div class="project-content">

            <div class="card">
                <h2 class="section-title">项目简介</h2>
                <div class="project-description">
                    <p>
                        &ensp;&ensp;&ensp;&ensp;这应该是大一时满腔热血时所做的项目，当时年少无知，被骗进组里面狠狠做了3D模型，帮助学长学姐拿到了奖项，即使是我退出之后，我的3D模型依旧在发光发热，你可能不知道，这是我大一时候就做出来的东西，但是到了大二新进组的人还在向我要文件，可以说是传承下去了。
                        <br>
                        &ensp;&ensp;&ensp;&ensp;总之这也算是一段痛并快乐着的经历。
                        <br>
                    </p>
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">项目图片</h2>
                <div class="project-images" style="display: flex; flex-wrap: wrap;  border-width: 2px; 
                border-color: rgb(108, 192, 231);  border-style:dotted; border-radius: 20px; margin: 20px;
                padding: 20px;">
                    <img src="../project/数字岩芯/海报.png" alt="项目图片1" style="object-fit: cover;">
                    <img src="../project/数字岩芯/笔记本模型_0009.png" style="object-fit: cover;" alt="项目图片2">
                    <img src="../project/数字岩芯/数字岩芯_渲染图.png" alt="项目图片3">
                    <img src="../project/数字岩芯/数字岩芯左视图.png" alt="项目图片4">
                </div>
            </div>

            <div class="card">
                <h2 class="section-title">项目展示</h2>
                <div class="project-description">
                    <p>很遗憾，目前只有图片资料</p>
                </div>

            </div>




        </div>
    </div>

</body>

</html>
